# Save as: .github/workflows/playwright.yml
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   ORANGEHRM_BASE_URL   e.g. https://opensource-demo.orangehrmlive.com
#   ORANGEHRM_USERNAME
#   ORANGEHRM_PASSWORD
#
# Requirements in playwright.config.js:
#   - a `setup` project (tests/auth/auth.setup.js) and `dependencies: ['setup']`
#     on the browser projects, so the gitignored auth state is generated in CI
#   - use.baseURL: process.env.ORANGEHRM_BASE_URL
#   - reporters: list, html (open: 'never'), junit (outputFile: 'test-results/junit.xml')
#   - forbidOnly: !!process.env.CI, retries: process.env.CI ? 1 : 0

name: Playwright Tests

on:
  pull_request:
  push:
    branches:
      - 'feature/**'
  schedule:
    - cron: '0 2 * * 1-5'   # weekdays 02:00 UTC, full suite
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file or folder to run (blank = full suite)'
        required: false
        default: ''
      project:
        description: 'Playwright project (blank = all, e.g. chromium)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      ORANGEHRM_BASE_URL: ${{ secrets.ORANGEHRM_BASE_URL }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base branch

      - name: Check required secrets are set
        run: |
          missing=0
          for v in ORANGEHRM_BASE_URL ORANGEHRM_USERNAME ORANGEHRM_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Uses .nvmrc if present; otherwise change to e.g. node-version: 20
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # List only the browsers your config uses to save time
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Select tests to run
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_SPEC: ${{ github.event.inputs.spec }}
          INPUT_PROJECT: ${{ github.event.inputs.project }}
        run: |
          args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ -n "$INPUT_SPEC" ] && args="$INPUT_SPEC"
            [ -n "$INPUT_PROJECT" ] && args="$args --project=$INPUT_PROJECT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'tests/*.spec.js' 'tests/**/*.spec.js' | tr '\n' ' ')
            if [ -n "$changed" ]; then
              args="$changed"
              echo "Running changed specs: $changed"
            else
              echo "No spec files changed; running full suite."
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        env:
          TEST_ARGS: ${{ steps.select.outputs.args }}
        # TEST_ARGS is intentionally unquoted so multiple spec paths split into separate args
        run: npx playwright test $TEST_ARGS

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces, screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa-reports/
          retention-days: 30
          if-no-files-found: ignore
