name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment || 'dev' }}

    steps:
      # ---------------------------------------------
      # Checkout repository
      # ---------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Setup Node.js
      # ---------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------
      # Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------
      # Install Playwright browsers
      # Chromium + WebKit
      # ---------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      # ---------------------------------------------
      # Display versions
      # ---------------------------------------------
      - name: Display versions
        run: |
          node --version
          npm --version
          npx playwright --version
          npx allure --version

      # ---------------------------------------------
      # Run Playwright tests
      # ---------------------------------------------
      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          QA_USERNAME: ${{ secrets.QA_USERNAME  }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

        run: |
          echo "QA_USERNAME exists: ${{ secrets.QA_USERNAME != '' }}"
          echo "QA_PASSWORD exists: ${{ secrets.QA_PASSWORD != '' }}"
          npx playwright test

      # ---------------------------------------------
      # Generate Allure report
      # Runs even if tests fail
      # ---------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          rm -rf allure-report
          npx allure generate --output allure-report allure-results

      # ---------------------------------------------
      # Upload Allure report as artifact
      # Backup/download option
      # ---------------------------------------------
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      # ---------------------------------------------
      # Upload Playwright HTML report
      # ---------------------------------------------
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      # ---------------------------------------------
      # Upload screenshots/videos/traces
      # ---------------------------------------------
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: test-results/
          if-no-files-found: warn

      # ---------------------------------------------
      # Prepare GitHub Pages
      # ---------------------------------------------
      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      # ---------------------------------------------
      # Upload Allure report for GitHub Pages
      # ---------------------------------------------
      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # =================================================
  # Deploy Allure report to GitHub Pages
  # =================================================
  deploy:
    if: always()
    needs: test

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
